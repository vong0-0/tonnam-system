type: object
description: RFC 9457 Problem Details for HTTP APIs.
properties:
  type:
    type: string
    format: uri
    description: A URI reference identifying the problem type.
    example: "https://srms.example.com/errors/not-found"
  title:
    type: string
    description: A short, human-readable summary of the problem type.
    example: "Not Found"
  status:
    type: integer
    description: The HTTP status code.
    example: 404
  detail:
    type: string
    description: A human-readable explanation specific to this occurrence of the problem.
    example: "The requested resource was not found."
  instance:
    type: string
    format: uri-reference
    description: A URI reference identifying the specific occurrence of the problem.
    example: "/v1/tables/abc-123"
  traceId:
    type: string
    description: Unique identifier for tracing this error occurrence.
    example: "abc-123-xyz"
  timestamp:
    type: string
    format: date-time
    description: The time the error occurred.
    example: "2025-05-20T14:28:00Z"
  errors:
    type: array
    nullable: true
    description: List of field-level validation errors.
    items:
      type: object
      properties:
        field:
          type: string
          example: "username"
        message:
          type: string
          example: "must be between 2 and 100 characters"
        code:
          type: string
          example: "REQUIRED_FIELD"
      required:
        - field
        - message
        - code
required:
  - type
  - title
  - status
  - detail
  - instance
  - traceId
  - timestamp
