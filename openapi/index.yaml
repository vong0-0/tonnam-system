openapi: 3.0.3

info:
  title: SRMS API
  version: 1.0.0
  description: >
    REST API for the **Smart Restaurant Management System (SRMS)**.

    SRMS consists of four subsystems:

    - **POS System** (Cashier) — table management, bill creation, payment processing, daily summary
    - **Waiter App** (Waiter) — order taking, sending orders to kitchen, receiving notifications
    - **Kitchen System** (Kitchen) — view incoming orders, mark items as cooked, send WhatsApp notifications
    - **Admin Backend** (Admin) — master data, order history, audit logs, analytics

    All endpoints require Bearer JWT authentication except `POST /auth/login`.

  license:
    name: ISC
  contact:
    name: Vongsouvan Chanthasone
    email: vongsouvan@gmail.com

servers:
  - url: http://localhost:3000
    description: Development
  - url: https://staging-api.srms.example.com
    description: Staging
  - url: https://api.srms.example.com
    description: Production

security:
  - BearerAuth: []

tags:
  - name: Auth
    description: >
      Handles authentication flows including login with username and password, 
      access token refresh, logout, and issuing short-lived WebSocket tickets
      for real-time connections.
  - name: Users
    description: >
      Manages staff accounts across all roles (Admin, Waiter, Kitchen, Cashier).
      Admin-only. Supports creating, updating, deactivating accounts,
      and searching by name, username, phone, or email.
  - name: Tables
    description: >
      Manages restaurant tables including regular and temporary extension tables.
      Covers status transitions (Available, Reserved, Occupied, Partially Paid, Paid),
      manual status updates, and moving tables between locations.
  - name: TableMergeGroups
    description: >
      Manges table merge groups. Allows merging multiple tables or existing groups
      into a single group, viewing group details with associated bills,
      and unmerging groups back to individual tables with bill reassignment.
  - name: Reservations
    description: >
      Manages advanced table reservations made by phone.
      Supports creating reservations with gust name, phone, party size, and time,
      confirming arrivals, and cancelling no-shows.
  - name: MenuCategories
    description: >
      Manages menu categories used to group menu items. 
      Admin-only. Supports creating, updating, and deleting categories.
      categories cannot be deleted while menu items are assigned to them.
  - name: MenuItems
    description: >
      Manages individual menu items including name, price, image, and category.
      Admin-only for create, update, and delete.
      Cashier can toggle availabbility and sold-out status,
      which broadcasts real-time updates to POS and Waiter App.
  - name: Bills
    description: >
      Manages the full bill lifecycle from creation to payment.
      Supports multiple bills per table, bill splitting, editing order items,
      cancellation with reason, and tracking partial and full payments.
      Every edit requires a reson and is recorded in the audit log.
  - name: Orders
    description: >
      Manages kitchen orders created by Waiter or Cashier.
      Each order is immediately sent to the Kitchen upon creation.
      Supports viewing orders by status, and cancelling individual order items
      with a required reason logged to the audit trail.
  - name: Payments
    description: >
      Processes bill payments supporting three methods:
      Cash (with automatic change calculation),
      QR PromptPay (Cashier-confirmed). and Mixed (cash and QR combined).
      Mixed payments must cover the full bill amount in a single transaction.
  - name: AuditLogs
    description: >
      Provides an immurale audit trail for all sensitive operations
      including bill edits, cancellations, and order item changes.
      Admin-only. Records actor, action, reason, and before/after state with timestamps for every entry.
  - name: Analytics
    description: >
      Provides sales and menu performance analytics.
      Available to Admin and Cashier.
      Sales analytices include revenue summaries by period, period-over-period comparison,
      revenue breakdown by category, and peak hour data.
      Menu analytices include best sellers, dead menu detection, and menu mix analysis.

