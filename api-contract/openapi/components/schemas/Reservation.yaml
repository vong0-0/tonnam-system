type: object
description: A table reservation made in advance for a guest.
properties:
  id:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  table_id:
    type: string
    description: The table being reserved.
    example: "64f1a2b3c4d5e6f7a8b9c0d2"
  reserver_name:
    type: string
    description: Name of the guest who made the reservation.
    example: "Wanchai Pongsakorn"
  phone:
    type: string
    description: Contact phone number of the guest.
    example: "0812345678"
  party_size:
    type: integer
    description: Expected number of guests.
    minimum: 1
    example: 4
  reserved_at:
    type: string
    format: date-time
    description: Scheduled date and time for the reservation.
    example: "2025-05-21T19:00:00Z"
  status:
    type: string
    enum: [PENDING, CONFIRMED, CANCELLED]
    description: Current status of the reservation.
  notes:
    type: string
    nullable: true
    description: Optional special instructions or notes from the guest.
    example: "Anniversary dinner, please arrange flowers."
  created_by:
    type: string
    description: ID of the user who created the reservation.
    example: "64f1a2b3c4d5e6f7a8b9c0d4"
  created_at:
    type: string
    format: date-time
    example: "2025-05-20T10:00:00Z"
  updated_at:
    type: string
    format: date-time
    example: "2025-05-20T10:00:00Z"
required:
  - id
  - table_id
  - reserver_name
  - phone
  - party_size
  - reserved_at
  - status
  - created_by
  - created_at
  - updated_at
