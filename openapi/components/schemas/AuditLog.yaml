type: object
description: >
  An immutable record of a sensitive operation. Created whenever a user
  performs an action that requires justification (e.g. cancelling a bill,
  cancelling an order item, applying a discount).
properties:
  id:
    type: string
    format: uuid
    example: "e1f2a3b4-c5d6-7890-efab-901234567890"
  userId:
    type: string
    format: uuid
    description: ID of the user who performed the action.
  action:
    type: string
    description: >
      Identifier for the operation performed.
      Examples: CANCEL_BILL, CANCEL_ORDER, CANCEL_ORDER_ITEM,
      APPLY_DISCOUNT, MERGE_TABLES, UNMERGE_TABLES, SPLIT_BILL.
    example: "CANCEL_BILL"
  entityType:
    type: string
    description: The type of resource that was affected.
    enum: [Bill, Order, OrderItem, Table, TableMergeGroup, Payment]
    example: "Bill"
  entityId:
    type: string
    format: uuid
    description: ID of the affected resource.
    example: "a7b8c9d0-e1f2-3456-abcd-567890123456"
  reason:
    type: string
    description: Mandatory justification provided by the user at the time of the action.
    example: "Customer changed mind and left before payment."
  metadata:
    type: object
    nullable: true
    additionalProperties: true
    description: Optional snapshot or additional context captured at the time of the action.
    example:
      previousStatus: "OPEN"
      totalAmount: 560.00
  createdAt:
    type: string
    format: date-time
    example: "2025-05-20T21:05:00Z"
required:
  - id
  - userId
  - action
  - entityType
  - entityId
  - reason
  - createdAt
