type: object
description: Standard response envelope wrapping all successful API responses.
properties:
  success:
    type: boolean
    description: Whether the request was successful.
    example: true
  message:
    type: string
    description: Human-readable status message.
    example: "OK"
  data:
    description: Response payload. Type varies per endpoint.
  pagination:
    $ref: './Pagination.yaml'
required:
  - success
  - message
  - data
