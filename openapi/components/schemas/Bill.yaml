type: object
description: >
  A bill issued for a table session. A table may accumulate multiple bills
  (e.g. after a split). Sub-bills use slash notation: B-0001/A, B-0001/B.
properties:
  id:
    type: string
    format: uuid
    example: "a7b8c9d0-e1f2-3456-abcd-567890123456"
  billNumber:
    type: string
    description: Human-readable bill identifier. Sub-bills use parent number with suffix.
    example: "B-0001"
  tableId:
    type: string
    format: uuid
    description: The table this bill belongs to.
    example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
  parentBillId:
    type: string
    format: uuid
    nullable: true
    description: Set when this bill was created by splitting a parent bill.
    example: null
  status:
    type: string
    enum: [OPEN, PARTIALLY_PAID, PAID, CANCELLED]
    description: >
      Lifecycle: OPEN → PARTIALLY_PAID → PAID.
      CANCELLED requires a reason and creates an AuditLog entry.
  totalAmount:
    type: number
    format: decimal
    description: Sum of all order item prices before discounts.
    example: 560.00
  discountAmount:
    type: number
    format: decimal
    description: Total discount applied. Discount changes require an AuditLog entry.
    default: 0
    example: 0.00
  netAmount:
    type: number
    format: decimal
    description: Payable amount after discount (totalAmount - discountAmount).
    example: 560.00
  paidAmount:
    type: number
    format: decimal
    description: Amount already paid across all payments for this bill.
    default: 0
    example: 0.00
  createdBy:
    type: string
    format: uuid
    description: ID of the cashier who opened this bill.
  cancelReason:
    type: string
    nullable: true
    description: Required when status is CANCELLED.
    example: null
  createdAt:
    type: string
    format: date-time
    example: "2025-05-20T18:30:00Z"
  updatedAt:
    type: string
    format: date-time
    example: "2025-05-20T21:00:00Z"
required:
  - id
  - billNumber
  - tableId
  - status
  - totalAmount
  - discountAmount
  - netAmount
  - paidAmount
  - createdBy
  - createdAt
  - updatedAt
