type: object
description: A grouping of menu items (e.g. Appetizers, Main Course, Beverages).
properties:
  id:
    type: string
    example: "64f1a2b3c4d5e6f7a8b9c0d1"
  name:
    type: string
    description: Display name of the category.
    example: "Main Course"
  description:
    type: string
    nullable: true
    description: Optional longer description of the category.
    example: "Signature dishes from our chef."
  item_count:
    type: integer
    description: Number of menu items assigned to this category.
    example: 10
  created_at:
    type: string
    format: date-time
    example: "2025-01-01T08:00:00Z"
  updated_at:
    type: string
    format: date-time
    example: "2025-05-20T12:00:00Z"
required:
  - id
  - name
  - item_count
  - created_at
  - updated_at
