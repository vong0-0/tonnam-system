menu-dead-items:
  get:
    tags:
      - Analytics
    summary: Get dead menu items
    description: >
      Returns menu items that have sold below the threshold quantity.
      Default threshold is 5.
      daily period is not supported — only weekly, monthly, yearly.
      Accessible to ADMIN only.
    operationId: getMenuDeadItems
    parameters:
      - name: period
        in: query
        required: true
        schema:
          type: string
          enum: [weekly, monthly, yearly]
        description: Time period. daily is not supported for dead item detection.
      - name: date
        in: query
        required: true
        schema:
          type: string
          format: date
          example: "2025-05-20"
        description: Reference date for the period.
      - name: threshold
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 5
        description: Items sold below this quantity are considered dead. Default is 5.
    responses:
      "200":
        description: Dead menu items retrieved successfully.
        content:
          application/json:
            schema:
              allOf:
                - $ref: "../components/schemas/EnvelopeResponse.yaml"
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        period:
                          type: string
                          example: "monthly"
                        date:
                          type: string
                          format: date
                          example: "2025-05-01"
                        threshold:
                          type: integer
                          example: 5
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              menu_item_id:
                                type: string
                                example: "64f1a2b3c4d5e6f7a8b9c0d4"
                              name:
                                type: string
                                example: "Steamed Fish with Lemon"
                              category_name:
                                type: string
                                example: "Main Course"
                              total_quantity_sold:
                                type: integer
                                example: 2
                              total_revenue:
                                type: number
                                format: decimal
                                example: 560.00
                              unit_price:
                                type: number
                                format: decimal
                                example: 280.00
                              is_available:
                                type: boolean
                                example: true
                              is_sold_out:
                                type: boolean
                                example: false
                            required:
                              - menu_item_id
                              - name
                              - category_name
                              - total_quantity_sold
                              - total_revenue
                              - unit_price
                              - is_available
                              - is_sold_out
                      required:
                        - period
                        - date
                        - threshold
                        - items
      "400":
        description: >
          Validation error. Occurs when period or date is missing,
          or when period is daily (not supported for dead item detection).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/ProblemDetail.yaml"
            examples:
              missing_date:
                summary: date parameter missing
                value:
                  type: "https://srms.example.com/errors/validation-error"
                  title: "Validation Error"
                  status: 400
                  detail: "One or more query parameters failed validation."
                  instance: "/v1/analytics/menu/dead-items"
                  traceId: "abc-123-xyz"
                  timestamp: "2024-01-01T14:32:00Z"
                  errors:
                    - field: "date"
                      message: "date is required and must be a valid date format (YYYY-MM-DD)."
                      code: "REQUIRED_FIELD"
              daily_not_supported:
                summary: daily period not supported
                value:
                  type: "https://srms.example.com/errors/validation-error"
                  title: "Validation Error"
                  status: 400
                  detail: "daily period is not supported for dead item detection."
                  instance: "/v1/analytics/menu/dead-items"
                  traceId: "abc-123-xyz"
                  timestamp: "2024-01-01T14:32:00Z"
                  errors:
                    - field: "period"
                      message: "period must be one of: weekly, monthly, yearly."
                      code: "INVALID_VALUE"
      "401":
        $ref: "../components/responses/errors.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/errors.yaml#/Forbidden"

